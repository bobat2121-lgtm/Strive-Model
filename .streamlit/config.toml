[server]
headless = true
enableStaticServing = true   # static/: the Mine art and the Ringbearer font

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"     # viewers get a plain error, no stack trace (details stay in the app's logs)

[theme]                       # dark base; panel/theme.py styles the rest
base = "dark"
primaryColor = "#d9701e"
backgroundColor = "#07080d"
secondaryBackgroundColor = "#1a130f"
textColor = "#f3e6cf"
